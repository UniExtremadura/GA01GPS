<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea una cuenta de Subsonic Festival.">
    <title>Subsonic Festival | Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a class="logo" href="index.html" aria-label="Subsonic Fest, inicio">SUBSONIC<span>FEST</span></a>
        <nav aria-label="Navegación principal">
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="entradas.html">Entradas</a></li>
                <li><a href="escaleta.html">Escaleta</a></li>
                <li><a href="tienda.html">Tienda</a></li>
                <li><a href="registro.html" class="active" aria-current="page">Registro</a></li>
            </ul>
        </nav>
        <button class="menu-toggle" id="mobile-menu" type="button" aria-label="Abrir menú" aria-expanded="false">☰</button>
    </header>

    <main class="registro-page">
        <section class="registro-card" aria-labelledby="registro-title">
            <span class="badge">CUENTA SUBSONIC</span>
            <h1 id="registro-title">Únete al <span class="gradient-text">festival</span></h1>
            <p class="registro-intro">Crea tu cuenta para acceder a los servicios de Subsonic Festival.</p>

            <form id="registro-form" class="registro-form">
                <div class="registro-grid">
                    <div class="campo-registro">
                        <label for="nombre">Nombre <span aria-hidden="true">*</span></label>
                        <input id="nombre" name="nombre" type="text" autocomplete="given-name" maxlength="100" required>
                    </div>

                    <div class="campo-registro">
                        <label for="apellidos">Apellidos <span aria-hidden="true">*</span></label>
                        <input id="apellidos" name="apellidos" type="text" autocomplete="family-name" maxlength="100" required>
                    </div>

                    <div class="campo-registro campo-completo">
                        <label for="email">Correo electrónico <span aria-hidden="true">*</span></label>
                        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
                    </div>

                    <div class="campo-registro campo-completo">
                        <label for="password">Contraseña <span aria-hidden="true">*</span></label>
                        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="ayuda-password">
                        <small id="ayuda-password">Debe tener al menos 8 caracteres.</small>
                    </div>

                    <div class="campo-registro">
                        <label for="telefono">Teléfono</label>
                        <input id="telefono" name="telefono" type="tel" autocomplete="tel" maxlength="30">
                    </div>

                    <div class="campo-registro">
                        <label for="fechaNacimiento">Fecha de nacimiento</label>
                        <input id="fechaNacimiento" name="fechaNacimiento" type="date" autocomplete="bday">
                    </div>
                </div>

                <p class="registro-obligatorios">* Campos obligatorios</p>
                <p id="registro-feedback" class="registro-feedback" role="status" aria-live="polite"></p>
                <button id="registro-submit" class="btn btn-primary registro-submit" type="submit">Crear cuenta</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Subsonic Festival. Todos los derechos reservados.</p>
    </footer>

    <script src="app.js"></script>
    <script src="registro.js"></script>
</body>
</html>
